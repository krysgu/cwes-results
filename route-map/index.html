<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Searchable UPWC and WIEC route map from Ultra Wilderness.">
  <meta name="theme-color" content="#173f35">
  <title>Route Map | Ultra Wilderness</title>
  <style>
    :root{--ink:#142e28;--forest:#173f35;--forest-deep:#0b2b24;--moss:#6e8461;--cream:#f4f0e6;--paper:#fbfaf6;--clay:#c56447;--gold:#d29a3a;--muted:#66726d;--line:#d8d8cd}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink)}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #uw-route-map{width:100%;max-width:1500px;margin:0 auto;padding:clamp(14px,2.5vw,30px)}
    .uw-map-header{display:grid;grid-template-columns:minmax(200px,1fr) minmax(300px,620px);gap:24px;align-items:end;margin-bottom:18px}
    .uw-map-header h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,6vw,72px);font-weight:500;letter-spacing:-.05em;line-height:.92}
    .uw-map-controls{display:grid;grid-template-columns:minmax(210px,1fr) auto;gap:12px;align-items:end}
    .uw-search-wrap{position:relative}.uw-search-wrap label{display:block;margin:0 0 6px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    #uw-route-search{width:100%;height:46px;padding:0 42px 0 14px;border:1px solid #b8c1b9;border-radius:4px;background:var(--paper);color:var(--ink);font:600 15px/1 inherit;box-shadow:0 2px 8px rgba(20,46,40,.05)}
    #uw-route-search:focus{outline:3px solid rgba(210,154,58,.35);outline-offset:2px;border-color:var(--gold)}
    #uw-search-clear{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
    .uw-results{position:absolute;z-index:20;top:72px;left:0;right:0;max-height:280px;overflow:auto;margin:0;padding:6px;background:var(--paper);border:1px solid var(--line);box-shadow:0 16px 32px rgba(20,46,40,.16);list-style:none}
    .uw-results[hidden]{display:none}.uw-results button{display:flex;justify-content:space-between;gap:12px;width:100%;padding:10px;border:0;background:transparent;color:var(--ink);font:650 13px/1.2 inherit;text-align:left;cursor:pointer}.uw-results button:hover,.uw-results button:focus{background:#ece7da;outline:0}.uw-results small{color:var(--muted);font-size:10px;letter-spacing:.08em}
    .uw-toggle{display:flex;align-items:center;gap:9px;height:46px;padding:0 14px;border:1px solid #b8c1b9;border-radius:4px;background:var(--paper);color:var(--ink);font-size:12px;font-weight:750;white-space:nowrap}.uw-toggle input{width:18px;height:18px;accent-color:var(--forest)}
    .uw-map-frame{position:relative;overflow:hidden;border:1px solid #c9c9bd;background:#e9e2d2;min-height:420px}
    #uw-map-svg{display:block;width:100%;height:auto;min-height:420px;touch-action:manipulation}
    .uw-state{fill:#e9e2d2;stroke:#9aa69f;stroke-width:1.1;vector-effect:non-scaling-stroke}.uw-state:nth-of-type(2n){fill:#eee8dc}.uw-state-label{fill:#73817a;opacity:.72;font:750 19px/1 system-ui,sans-serif;letter-spacing:.18em;text-anchor:middle}
    .uw-route{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;transition:opacity .18s,stroke-width .18s}.uw-route.UPWC{stroke:var(--forest)}.uw-route.WIEC{stroke:var(--clay)}
    .uw-region{fill:var(--forest);fill-opacity:.18;stroke:var(--forest);stroke-width:2;stroke-dasharray:8 5;vector-effect:non-scaling-stroke;transition:fill-opacity .18s,stroke-width .18s}.uw-hit{fill:none;stroke:transparent;stroke-width:15;cursor:pointer;pointer-events:stroke;vector-effect:non-scaling-stroke}.uw-region-hit{fill:transparent;stroke:transparent;stroke-width:14;cursor:pointer;pointer-events:all;vector-effect:non-scaling-stroke}
    .uw-label-leader{stroke-width:1;stroke-dasharray:2 3;opacity:.7;pointer-events:none;vector-effect:non-scaling-stroke}.uw-label-leader.UPWC{stroke:var(--forest)}.uw-label-leader.WIEC{stroke:var(--clay)}.uw-label{fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;font:750 10px/1 system-ui,sans-serif;text-anchor:middle;pointer-events:none}.uw-label.UPWC{fill:var(--forest)}.uw-label.WIEC{fill:#8c422f}
    .uw-map-frame.has-selection .uw-route:not(.selected),.uw-map-frame.has-selection .uw-region:not(.selected){opacity:.18}.uw-route.selected{stroke:var(--gold);stroke-width:7}.uw-region.selected{fill:var(--gold);fill-opacity:.34;stroke:var(--gold);stroke-width:5}.uw-label.selected{fill:var(--forest-deep);font-size:13px;stroke-width:6px}.uw-labels-off .uw-label:not(.selected){display:none}
    .uw-legend{position:absolute;left:16px;bottom:14px;display:flex;gap:18px;flex-wrap:wrap;padding:8px 10px;background:rgba(251,250,246,.9);border:1px solid rgba(216,216,205,.9);font-size:11px;font-weight:750}.uw-legend span{display:flex;align-items:center;gap:7px}.uw-legend i{display:inline-block;width:28px;height:4px;border-radius:2px}.uw-legend .upwc{background:var(--forest)}.uw-legend .wiec{background:var(--clay)}
    .uw-source{position:absolute;right:14px;bottom:14px;padding:7px 9px;background:rgba(251,250,246,.9);border:1px solid rgba(216,216,205,.9);color:var(--muted);font-size:10px}.uw-source a{color:inherit;font-weight:700;text-decoration:none}
    .uw-selected{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:48px;margin-top:10px;color:var(--muted);font-size:12px}.uw-selected strong{color:var(--ink)}.uw-selected a{color:var(--forest);font-weight:800;text-decoration-thickness:1.5px;text-underline-offset:3px}.uw-selected button{border:0;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
    @media(max-width:760px){#uw-route-map{padding:12px}.uw-map-header{grid-template-columns:1fr;gap:14px}.uw-map-controls{grid-template-columns:1fr}.uw-toggle{width:max-content}.uw-legend{left:8px;bottom:8px}.uw-source{right:8px;top:8px;bottom:auto}.uw-label{font-size:8.5px}.uw-selected{align-items:flex-start}.uw-map-frame{min-height:480px}#uw-map-svg{min-height:480px}}
  </style>
</head>
<body>

        <div class="uw-search-wrap">
          <label for="uw-route-search">Search routes</label>
          <input id="uw-route-search" type="search" autocomplete="off" placeholder="Start typing a route name" aria-controls="uw-route-results" aria-expanded="false">
          <button id="uw-search-clear" type="button" aria-label="Clear search">×</button>
          <ul class="uw-results" id="uw-route-results" hidden></ul>
        </div>
        <label class="uw-toggle"><input id="uw-label-toggle" type="checkbox" checked> Show route names</label>
      </div>
    </header>
    <section class="uw-map-frame" aria-label="Interactive UPWC and WIEC route map">
