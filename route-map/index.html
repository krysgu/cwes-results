  <title>Route Map | Ultra Wilderness</title>
  <style>
    :root{--ink:#142e28;--forest:#173f35;--forest-deep:#0b2b24;--moss:#6e8461;--cream:#f4f0e6;--paper:#fbfaf6;--clay:#c56447;--gold:#d29a3a;--muted:#66726d;--line:#d8d8cd}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink)}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #uw-route-map{width:100%;max-width:1500px;margin:0 auto;padding:clamp(14px,2.5vw,30px)}
    .uw-map-header{display:grid;grid-template-columns:minmax(200px,1fr) minmax(300px,620px);gap:24px;align-items:end;margin-bottom:18px}

    .uw-search-wrap{position:relative}.uw-search-wrap label{display:block;margin:0 0 6px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}

    function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function closeResults(){results.hidden=true;search.setAttribute('aria-expanded','false')}
    function showResults(){const q=search.value.trim().toLowerCase();if(!q){closeResults();return}const matches=entries.filter(d=>d.name.toLowerCase().includes(q)).slice(0,10);results.innerHTML=matches.length?matches.map(d=>`<li><button type="button" data-id="${d.id}"><span>${escapeHtml(d.name)}</span><small>${d.family}</small></button></li>`).join(''):'<li><button type="button" disabled>No matching route</button></li>';results.hidden=false;search.setAttribute('aria-expanded','true')}
    search.addEventListener('input',showResults);search.addEventListener('focus',showResults);search.addEventListener('keydown',event=>{if(event.key==='Enter'){const first=results.querySelector('button[data-id]');if(first){event.preventDefault();selectRoute(first.dataset.id)}}if(event.key==='Escape')closeResults()});
    results.addEventListener('click',event=>{const button=event.target.closest('button[data-id]');if(button)selectRoute(button.dataset.id)});
    clear.addEventListener('click',()=>{search.value='';selectRoute(null);search.focus()});toggle.addEventListener('change',()=>frame.classList.toggle('uw-labels-off',!toggle.checked));
    document.addEventListener('click',event=>{if(!event.target.closest('.uw-search-wrap'))closeResults()});
    window.__routeMapReady={entries:entries.length,upwc:entries.filter(d=>d.family==='UPWC').length,wiec:entries.filter(d=>d.family==='WIEC').length};
  })();
  </script>
</body>
</html>
